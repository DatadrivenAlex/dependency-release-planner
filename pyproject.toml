[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "dependency-release-planner"
version = "0.1.0"
requires-python = ">=3.11"
description = "Deterministic dependency graph impact analysis and rebuild planning demo"
dependencies = []
[project.scripts]
releaseplan = "releaseplan.cli:main"
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
[tool.setuptools.packages.find]
include = ["releaseplan*"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
